[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lighttar"
dynamic = ["version"]
description = "LightTAR: target-aware tabular features from frozen encoder layers, in closed form. A scikit-learn step for tabular models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eilam Shapira", email = "eilamshapira@campus.technion.ac.il" }]
maintainers = [{ name = "Eilam Shapira", email = "eilamshapira@campus.technion.ac.il" }]
keywords = [
    "tabular", "text embeddings", "partial least squares", "feature extraction",
    "in-context learning", "tabular foundation models", "scikit-learn",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.22", "pandas>=1.5", "scikit-learn>=1.2"]

[project.optional-dependencies]
text = ["torch>=2.0", "transformers>=4.30"]
image = ["torch>=2.0", "transformers>=4.56", "Pillow>=9"]
gate = ["lightgbm>=4.0"]
all = ["lighttar[text,image,gate]"]
dev = ["lighttar[all]", "pytest>=7", "ruff>=0.6", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/eilamshapira/LightTAR"
Repository = "https://github.com/eilamshapira/LightTAR"
Issues = "https://github.com/eilamshapira/LightTAR/issues"

[tool.hatch.version]
path = "src/lighttar/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lighttar"]

[tool.hatch.build.targets.sdist]
include = ["/src/lighttar", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = []
